[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [".", "crates/sdro-types", "crates/sdro-proto", "crates/sdro-dsp", "crates/sdro-radio", "crates/sdro-config"]
# The vendored crates are reached through `[patch.crates-io]`, not as members:
# they are upstream's code under upstream's licences, not ours to lint or
# version with the rest.
exclude = ["vendor/soapysdr", "vendor/ewebsock", "vendor/xng"]

[patch.crates-io]

# `ewebsock` 0.8.0 with one error classifier widened. On Windows a blocking
# read whose timeout expires may be answered with `ERROR_IO_PENDING` (997)
# rather than with a timeout, and upstream treats anything that is not
# `WouldBlock`/`TimedOut` as a dead connection — so a remote client lost its
# session every twenty minutes or so and had to be reconnected by hand.
# See vendor/ewebsock/PROVENANCE.md; this stays until upstream carries it.
ewebsock = { path = "vendor/ewebsock" }

# `soapysdr` 0.5.1 with one method added: `Device::setting_info`, the call that
# says which settings a driver has. Upstream wraps `readSetting`/`writeSetting`
# but not the enumeration, and the raw device pointer it needs is private to the
# crate — so a host can set a driver setting it already knows the name of, but
# cannot discover one. That is what the SoapySDR settings panel is built on.
# See vendor/soapysdr/PROVENANCE.md; this stays until the method is upstream.
soapysdr = { path = "vendor/soapysdr" }

[workspace.package]
version = "1.0.0"
edition = "2024"
# The native binary links mfsk-core (GPL-3.0-only) for FT8/FT4 and the
# DeepCW model (AGPL-3.0-only) for CW, so the built binary carries both. AGPL is
# the stronger of the two and it adds §13: whoever is offered the program over a
# network has to be offered its source. Anyone running sdro-server for remote
# clients is doing exactly that.
#
# Both are confined to one crate each — sdro-digi and sdro-deepcw — and
# the wasm remote client links neither.
license = "GPL-3.0-or-later"

# DSP is unusably slow unoptimized; keep deps and the sample-rate-hot crates
# fast in dev builds while the rest stays quick to compile.
[profile.dev.package."*"]
opt-level = 2

# Rust 1.99 (LLVM) never finishes optimizing mfsk-core 0.10.0 at opt-level 3 for
# aarch64 — the Linux and macOS ARM release jobs ran into the 6 h timeout from
# 1 Oct 2026 on. At 2 it builds in under a minute. Profiles can't be per target,
# so x86 gets the same; drop this once a toolchain no longer hangs. Kept for
# 0.14.0, which has not been tried at 3 on aarch64.
[profile.release.package.mfsk-core]
opt-level = 2

# A release build of sdro-ui does not reproduce when it is split into
# several codegen units: recompiling it from identical inputs (identical
# rmeta) leaves a few of its object files different, with drop glue and
# closure shims landing in other units, both natively and for wasm32 on Rust
# 1.98.1. That breaks bit-for-bit rebuilds of the -compat binaries and the web
# client (see .github/workflows/reproducible.yml). One unit makes it stable,
# for about half a minute more build time.
[profile.release.package.sdro-ui]
codegen-units = 1

[profile.dev.package.sdro-dsp]
opt-level = 2

[profile.dev.package.sdro-radio]
opt-level = 2

# The CW skimmer's STFT + per-bin scan run every audio block; unoptimized they
# stutter the audio, so keep them fast in dev too.
[profile.dev.package.sdro-skimmer]
opt-level = 2

# The ISM burst gate measures the power of every sample on every channel in the
# plan; unoptimized that alone outweighs the rest of the receive chain.
[profile.dev.package.sdro-ism]
opt-level = 2

# The ADS-B preamble correlator touches every sample of a 2.4 Msps stream and
# then slices 112 bits per candidate; unoptimized it costs more than everything
# else in the receive chain put together.
[profile.dev.package.sdro-adsb]
opt-level = 2

# Seven VDL2 channels each get a downconverter and a burst gate over the same
# window, and every one of them measures the power of every sample; unoptimized
# that alone outweighs the rest of the receive chain, exactly as the ISM gate
# does.
[profile.dev.package.sdro-vdl2]
opt-level = 2

# Both AIS channels get a down-converter, a burst gate and a receive filter over
# the same window, and the filter is a dot product per sample; unoptimized that
# alone outweighs the rest of the receive chain, exactly as the VDL2 lane does.
[profile.dev.package.sdro-ais]
opt-level = 2

# RADE's per-frame buffer shuffling sits between two C libraries that are
# always built optimized; leaving the Rust glue slow would stall the worker.
[profile.dev.package.sdro-rade]
opt-level = 2

# The DRM worker shuffles buffers between two always-optimized C libraries on
# every block, for the same reason RADE's does.
[profile.dev.package.sdro-drm]
opt-level = 2

# DeepCW's STFT runs ahead of every inference; unoptimized it costs more than
# the network it feeds.
[profile.dev.package.sdro-deepcw]
opt-level = 2

[workspace.dependencies]
sdro-types = { path = "crates/sdro-types" }
# The build stamp. No dependencies and no build inputs beyond one
# environment variable, so it builds for wasm32 alongside everything else.
sdro-version = { path = "crates/sdro-version" }
sdro-proto = { path = "crates/sdro-proto" }
sdro-dsp = { path = "crates/sdro-dsp" }
sdro-atchat = { path = "crates/sdro-atchat" }
sdro-rade = { path = "crates/sdro-rade" }
sdro-drm = { path = "crates/sdro-drm" }
sdro-faad2 = { path = "crates/sdro-faad2" }
sdro-nrsc5 = { path = "crates/sdro-nrsc5" }
sdro-audio = { path = "crates/sdro-audio" }
sdro-server = { path = "crates/sdro-server" }
sdro-config = { path = "crates/sdro-config" }
sdro-ui = { path = "crates/sdro-ui" }
sdro-cat = { path = "crates/sdro-cat" }
sdro-midi = { path = "crates/sdro-midi" }
sdro-rigctld = { path = "crates/sdro-rigctld" }
sdro-rotator = { path = "crates/sdro-rotator" }
sdro-hpsdr = { path = "crates/sdro-hpsdr" }
sdro-tci = { path = "crates/sdro-tci" }
sdro-icomnet = { path = "crates/sdro-icomnet" }
sdro-smartsdr = { path = "crates/sdro-smartsdr" }
sdro-r82xx = { path = "crates/sdro-r82xx" }
sdro-rtlsdr = { path = "crates/sdro-rtlsdr" }
sdro-rx888 = { path = "crates/sdro-rx888" }
sdro-airspyhf = { path = "crates/sdro-airspyhf" }
sdro-airspy = { path = "crates/sdro-airspy" }
sdro-hydrasdr = { path = "crates/sdro-hydrasdr" }
sdro-hackrf = { path = "crates/sdro-hackrf" }
sdro-pluto = { path = "crates/sdro-pluto" }
sdro-sdrplay = { path = "crates/sdro-sdrplay" }
sdro-elad = { path = "crates/sdro-elad" }
sdro-lime = { path = "crates/sdro-lime" }
sdro-limerfe = { path = "crates/sdro-limerfe" }
sdro-fobos = { path = "crates/sdro-fobos" }
sdro-relay = { path = "crates/sdro-relay" }
sdro-hardrock = { path = "crates/sdro-hardrock" }
sdro-spyserver = { path = "crates/sdro-spyserver" }
sdro-kiwisdr = { path = "crates/sdro-kiwisdr" }
sdro-net = { path = "crates/sdro-net" }
sdro-winlink = { path = "crates/sdro-winlink" }
sdro-ax25 = { path = "crates/sdro-ax25" }
sdro-tnc = { path = "crates/sdro-tnc" }
sdro-mercury = { path = "crates/sdro-mercury" }
sdro-data2g = { path = "crates/sdro-data2g" }
sdro-kiss = { path = "crates/sdro-kiss" }
sdro-deepcw = { path = "crates/sdro-deepcw" }
sdro-ism = { path = "crates/sdro-ism" }
sdro-aprs = { path = "crates/sdro-aprs" }
sdro-adsb = { path = "crates/sdro-adsb" }
sdro-vdl2 = { path = "crates/sdro-vdl2" }
sdro-ais = { path = "crates/sdro-ais" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
rustfft = "6"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
postcard = { version = "1", features = ["use-std"] }
crossbeam-channel = "0.5"
rtrb = "0.4"
# HFDL (ARINC 635) decode core, vendored under `vendor/xng` — a submodule pinned
# to one commit, so the build takes no network dependency of its own. The crates
# are not on crates.io and are reached by path (Route A, green-lit on
# dividebysandwich/sdroxide#497). The dependency tree is modest (rustfft,
# num-complex, chrono, serde, crc — no protobuf); `airframesio/xng` is
# MIT/Apache-2.0 and its `PROVENANCE.md` records a clean-room derivation from
# ICAO Annex 10 / ARINC 635.
#
# Note for `cargo fmt`: unlike the other vendored trees, which are reached
# through `[patch.crates-io]`, this one is a plain path dependency — so
# `cargo fmt --all` follows it into xng's *own* workspace and rewrites every
# crate in it, about 800 files of upstream's code that are not ours to format.
# Nothing is committed by that (the submodule just goes dirty), but it is
# alarming and easy to mistake for a real diff. rustfmt's `ignore` key would
# fix it and is nightly-only, so on stable format our own crates by name
# instead: `cargo fmt -p sdro-radio -p sdro-ui …`, or check with
# `cargo fmt --all --check` and read past the `vendor/xng` lines.
xng-mode-hfdl = { path = "vendor/xng/crates/xng-mode-hfdl" }
# Pure-Rust USB — the RTL-SDR backend's only dependency. No libusb, so it needs
# no system library on any target and ships in every build variant.
nusb = "0.2.7"
# Runtime dlopen, for the SDRplay backend's closed vendor library. Nothing is
# linked at build time, so this too ships in every build variant and simply
# reports "not installed" where the vendor API is absent.
libloading = "0.9"

[package]
name = "sdro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PowerSDR/Thetis-style SDR transceiver with a native GUI, a browser-served web UI, and FT8/FT4 digital modes"

[dependencies]
sdro-types.workspace = true
sdro-version.workspace = true
sdro-proto.workspace = true
sdro-dsp.workspace = true
sdro-nrsc5.workspace = true
sdro-radio = { path = "crates/sdro-radio", default-features = false }
sdro-config.workspace = true
sdro-net.workspace = true
sdro-audio.workspace = true
sdro-server.workspace = true
sdro-cat.workspace = true
sdro-hpsdr.workspace = true
sdro-tci.workspace = true
sdro-smartsdr.workspace = true
sdro-icomnet.workspace = true
sdro-rtlsdr.workspace = true
sdro-rx888.workspace = true
sdro-airspyhf.workspace = true
sdro-airspy.workspace = true
sdro-hydrasdr.workspace = true
sdro-fobos.workspace = true
sdro-hackrf.workspace = true
sdro-pluto.workspace = true
sdro-sdrplay.workspace = true
sdro-elad.workspace = true
sdro-lime.workspace = true
sdro-limerfe.workspace = true
sdro-relay.workspace = true
sdro-spyserver.workspace = true
sdro-kiwisdr.workspace = true
sdro-ui = { workspace = true, features = ["remote"] }
# `accesskit` is one of eframe's defaults, and turning the defaults off
# silently switched it back off: without it the whole widget tree is
# invisible to NVDA, Orca and VoiceOver. It is native-only (it maps to
# egui-winit), so it costs the browser build nothing.
# `links` is another: without it `ctx.open_url` only logs "Cannot open url -
# feature \"links\" not enabled", so the update banner's sdroxide.com link and
# the manual's external links open nothing on the desktop. Also native-only.
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "links",
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "persistence",
] }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
num-complex.workspace = true
rtrb.workspace = true

[features]
default = ["soapy", "rtl433"]
# SoapySDR device support. Turn off (`--no-default-features`) for a CAT-only
# binary that builds and runs without libSoapySDR installed.
soapy = ["sdro-radio/soapy"]
# The several hundred ISM device decoders of the embedded rtl_433. Needs a C
# compiler, CMake, and `git submodule update --init --recursive`. Turn off for a
# build with only sdro's own ISM decoders.
rtl433 = ["sdro-radio/rtl433"]
# Bundle the trunk-built web client into the binary (run `trunk build
# --release` in crates/sdro-web first).
embed-web = ["sdro-server/embed-web"]

# `cargo deb` packaging (used by the release workflow with --no-build after a
# `--features embed-web` release build).
# Base .deb = the standard (non-SoapySDR) build: drives CAT/OpenHPSDR/TCI and
# needs no libSoapySDR, so no SoapySDR recommendation. Package name `sdro`.
[package.metadata.deb]
maintainer = "Josef Jahn <josef.jahn@gmail.com>"
copyright = "2026, Josef Jahn"
extended-description = """\
PowerSDR/Thetis-style software-defined-radio transceiver client with an egui \
GUI. Runs as a native desktop application or as a server that streams the same \
UI to a web browser. Drives CAT-controlled radios, OpenHPSDR, and TCI; includes \
FT8/FT4 digital modes and an integrated logbook. For SoapySDR device support \
(HackRF, RTL-SDR, etc.) install the sdro-soapysdr package instead."""
section = "hamradio"
priority = "optional"
license-file = ["LICENSE", "0"]
features = ["embed-web"]
assets = [
    ["target/release/sdro", "usr/bin/", "755"],
    ["packaging/linux/sdro.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/60-sdro-rtlsdr.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdro-rx888.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdro-airspyhf.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdro-hackrf.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdro-airspy.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdro-hydrasdr.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdro-elad.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdro-limerfe.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/60-sdro-relay.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/icons/sdro.svg", "usr/share/icons/hicolor/scalable/apps/sdro.svg", "644"],
    ["packaging/icons/sdro-16.png", "usr/share/icons/hicolor/16x16/apps/sdro.png", "644"],
    ["packaging/icons/sdro-24.png", "usr/share/icons/hicolor/24x24/apps/sdro.png", "644"],
    ["packaging/icons/sdro-32.png", "usr/share/icons/hicolor/32x32/apps/sdro.png", "644"],
    ["packaging/icons/sdro-48.png", "usr/share/icons/hicolor/48x48/apps/sdro.png", "644"],
    ["packaging/icons/sdro-64.png", "usr/share/icons/hicolor/64x64/apps/sdro.png", "644"],
    ["packaging/icons/sdro-128.png", "usr/share/icons/hicolor/128x128/apps/sdro.png", "644"],
    ["packaging/icons/sdro-256.png", "usr/share/icons/hicolor/256x256/apps/sdro.png", "644"],
    ["packaging/icons/sdro-512.png", "usr/share/icons/hicolor/512x512/apps/sdro.png", "644"],
    ["README.md", "usr/share/doc/sdro/README.md", "644"],
    # The speech voice, for the spoken-announcement feature. A separate data
    # file rather than something linked into the binary: it is CC BY-NC-SA,
    # which is not a licence a GPL program may absorb, and keeping it an
    # aggregated asset that the program merely reads is what keeps the two
    # apart. Its notice ships alongside, like the RX-888 firmware's below.
    ["assets/voices/en_US-hfc_female-medium.onnx", "usr/share/sdro/voices/", "644"],
    ["assets/voices/en_US-hfc_female-medium.onnx.json", "usr/share/sdro/voices/", "644"],
    ["assets/voices/en_US-hfc_female-medium.MODEL_CARD", "usr/share/sdro/voices/", "644"],
    ["assets/voices/LICENSE-voice.txt", "usr/share/doc/sdro/LICENSE-voice.txt", "644"],
    # CMUdict (BSD-2-Clause) is embedded in the binary for grapheme-to-phoneme.
    ["crates/sdro-speech/assets/LICENSE-cmudict.txt", "usr/share/doc/sdro/LICENSE-cmudict.txt", "644"],
    # The binary embeds the RX-888's FX3 firmware image, which is MIT licensed
    # rather than GPL like the rest: its notice has to ship with the package.
    ["crates/sdro-rx888/firmware/LICENSE.txt", "usr/share/doc/sdro/LICENSE-rx888-firmware.txt", "644"],
    # The DeepCW model, embedded for the CW decoder. AGPL-3.0-only, which is
    # stronger than this package's GPL and carries a network clause, so its
    # notice ships too — and unlike the ones above it constrains the package
    # rather than merely crediting a part of it.
    ["crates/sdro-deepcw/LICENSE", "usr/share/doc/sdro/LICENSE-deepcw.txt", "644"],
]

# SoapySDR .deb: links libSoapySDR, so recommend the driver modules (apt
# installs Recommends by default). Built with `cargo deb --variant soapysdr`.
[package.metadata.deb.variants.soapysdr]
name = "sdro-soapysdr"
recommends = "soapysdr-module-all"
extended-description = """\
PowerSDR/Thetis-style software-defined-radio transceiver client built on \
SoapySDR with an egui GUI. Runs as a native desktop application or as a \
server that streams the same UI to a web browser. Includes FT8/FT4 digital \
modes and an integrated logbook."""
