[package]
name = "sdro-fobos"
version.workspace = true
edition.workspace = true

# RigExpert Fobos SDR support through `libfobos` — LGPL-2.1, open source
# (github.com/rigexpert/libfobos), found with dlopen at *runtime* exactly the
# way sdro-sdrplay finds the closed `sdrplay_api` and sdro-lime finds
# the open-source `libLimeSuite`: nothing is linked at build time regardless
# of which of those libraries is open, because the point is not licensing —
# it's that this crate builds and ships in every variant without every
# contributor needing the vendor library installed just to compile sdro,
# and a machine without it gets an empty device list with an explanation
# rather than a build failure.
#
# `ffi`, `error`, `device` (enumerate/open), `handle`/`stream` (RF-port,
# single-channel HF/direct-sampling, and dual-channel HF sync-mode
# streaming, one thread + an `rtrb` ring, same shape as
# sdro-hydrasdr/sdro-airspy). `sdro-dsp` is `WbDdc`, the
# real-to-complex wideband downconverter sdro-rx888 already built and
# verified for the identical direct-sampling problem, reused here rather
# than reinvented, plus the adaptive `Diversity` filter for the dual-channel
# combining. `FobosConfig` and `Backend::Fobos` registration live in
# `sdro-types`/the `sdro` binary crate, not here — this crate has no
# dependency on either.
[dependencies]
thiserror.workspace = true
tracing.workspace = true
libloading.workspace = true
crossbeam-channel.workspace = true
rtrb.workspace = true
sdro-dsp.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
