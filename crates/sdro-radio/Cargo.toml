[package]
name = "sdro-radio"
version.workspace = true
edition.workspace = true

[features]
# SoapySDR is optional so a CAT-only build needs no libSoapySDR installed.
default = ["soapy", "rtl433"]
soapy = ["dep:soapysdr"]
# The embedded rtl_433 ISM decoders. Needs a C compiler, CMake and the
# vendor/rtl_433 submodule; turn off for a build without them.
rtl433 = ["sdro-ism/rtl433"]

[dependencies]
sdro-types.workspace = true
sdro-dsp.workspace = true
# DRM reception. Links a vendored C++ receiver, so it is native-only — which
# this crate already is.
sdro-drm.workspace = true
# HD Radio reception, through the libnrsc5 installed on the machine — found at
# run time, nothing linked (issue #488).
sdro-nrsc5.workspace = true
num-complex.workspace = true
thiserror.workspace = true
tracing.workspace = true
soapysdr = { version = "0.5.1", optional = true }
triple_buffer = "9.0.0"
# The block loop's fork/join. Only `join` is used, and only onto a pool of this
# crate's own making — see `lane_pool` in engine.rs.
rayon = "1"
crossbeam-channel.workspace = true
rtrb.workspace = true
sdro-config = { path = "../sdro-config" }
sdro-digi = { path = "../sdro-digi" }
sdro-kiss = { path = "../sdro-kiss" }
sdro-ax25 = { path = "../sdro-ax25" }
sdro-tnc = { path = "../sdro-tnc" }
sdro-skimmer = { path = "../sdro-skimmer" }
sdro-ism = { path = "../sdro-ism" }
sdro-adsb = { path = "../sdro-adsb" }
sdro-vdl2 = { path = "../sdro-vdl2" }
sdro-ais = { path = "../sdro-ais" }
sdro-qo100 = { path = "../sdro-qo100" }
# Native-only, like the rest of the `on_rx_iq` lanes: the HFDL decoder runs
# in the engine off a dedicated downconversion of the raw IQ.
sdro-hfdl = { path = "../sdro-hfdl" }
sdro-net = { path = "../sdro-net" }
sdro-winlink = { path = "../sdro-winlink" }
# Only for `tlesub`: the engine persists the satellite subscriptions and, being
# the machine with the config directory, is also the one that fetches them and
# reports what each listing holds. No tracking happens here — that is the UI's.
sdro-solar = { path = "../sdro-solar" }
# The built-in TCI server, which the engine owns and feeds. (The TCI *client*
# in the same crate is built by the binary, not from here.)
sdro-tci.workspace = true
# The built-in rigctld server: control-only, so unlike TCI it carries no
# streams — the engine just publishes state and drains requests.
sdro-rigctld = { path = "../sdro-rigctld" }
sdro-rotator = { path = "../sdro-rotator" }
# The station's external T/R switch: the relay that grounds the SDR's antenna
# while anything in this process is transmitting. Driven from the engine rather
# than from a source, because it follows the whole station and not one front end.
sdro-relay = { path = "../sdro-relay" }
sdro-hardrock = { path = "../sdro-hardrock" }
sdro-wsjtx = { path = "../sdro-wsjtx" }
# Received pictures to an FTP/FTPS server, the QSSTV way. Native-only, like
# everything else the engine talks to the network with.
sdro-picup = { path = "../sdro-picup" }
# SSTV: encode received images to PNG for the config store, decode composed
# TX images (PNG) back to RGB. Minimal formats to keep the build lean.
# JPEG as well as PNG: the transmit-preset store normalises whatever the
# operator picked, and the file picker offers both.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
shine-rs = "0.1.4"

[dev-dependencies]
# The APRS codec, so the transmit test can read back what the engine sent.
sdro-aprs.workspace = true
