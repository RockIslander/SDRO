[package]
name = "sdro-winlink"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Winlink radio-email client for sdro: the B2F/FBB forwarding protocol, LZHUF compression, secure login, and a mailbox — over the CMS telnet gateway."

# Native-only: blocking network I/O on its own threads. Must never be a
# dependency of any wasm-targeted crate.

[dependencies]
sdro-types.workspace = true
sdro-ax25.workspace = true
sdro-tnc.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The Winlink secure-login challenge is MD5 over a fixed salt. Used as a
# checksum against a published algorithm, not to protect anything.
md-5 = "0.11"

[dev-dependencies]
# tests/tnc_transport.rs drives a real Data2G station as the far end.
sdro-data2g.workspace = true
